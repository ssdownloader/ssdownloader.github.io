<script>
    (function initParticles() {
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let w, h;
        let particles = [];
        const count = 110;

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Particle {
            constructor() {
                this.reset(true);
            }
            reset(init) {
                this.x = Math.random() * w;
                this.y = init ? Math.random() * h : -10 - Math.random() * 50;
                this.size = Math.random() * 3 + 1.5;
                this.speedY = Math.random() * 0.8 + 0.4;
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.opacity = Math.random() * 0.6 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                
                if (this.y > h + 10) {
                    this.reset(false);
                    this.x = Math.random() * w;
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(168, 85, 247, ${this.opacity})`;
                ctx.fill();
                
                ctx.shadowColor = 'rgba(168, 85, 247, 0.2)';
                ctx.shadowBlur = 8;
            }
        }

        for (let i = 0; i < count; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, w, h);
            ctx.shadowBlur = 0;
            for (const p of particles) {
                p.update();
                p.draw();
            }
            requestAnimationFrame(animate);
        }
        animate();
    })();

        { key: 'orbdiff', label: { ru: 'OrbDiff', en: 'OrbDiff' }, header: { ru: 'Инструменты от OrbDiff | github.com/orbdiff', en: 'Tools from OrbDiff | github.com/orbdiff' }, desc: { ru: 'Prefetch, BAM, USN, память, процессы, USB и строки.', en: 'Prefetch, BAM, USN, memory, processes, USB and strings.' } },
        { key: 'spokwn', label: { ru: 'Spokwn', en: 'Spokwn' }, header: { ru: 'Инструменты от Spokwn | github.com/spokwn', en: 'Tools from Spokwn | github.com/spokwn' }, desc: { ru: 'BAM, журналы, кэш активностей, сервисы, процессы и пути.', en: 'BAM, journals, activity cache, services, processes and paths.' } },

        { key: 'nirsoft', label: { ru: 'NirSoft', en: 'NirSoft' }, header: { ru: 'Утилиты NirSoft | nirsoft.net', en: 'NirSoft utilities | nirsoft.net' }, desc: { ru: 'Утилиты для событий, USB, реестра, ShellBags и Prefetch.', en: 'Portable utilities for events, USB, registry, ShellBags and Prefetch.' } },
        { key: 'ericzimmerman', label: { ru: 'EricZimmerman', en: 'EricZimmerman' }, header: { ru: 'Инструменты Eric Zimmerman | ericzimmerman.github.io', en: 'Eric Zimmerman tools | ericzimmerman.github.io' }, desc: { ru: 'Amcache, журналы событий, Jump Lists, реестр, ShellBags, SRUM, MFT.', en: 'Amcache, event logs, Jump Lists, registry, ShellBags, SRUM, MFT.' } },

        { name: 'Java Library Analyzer', desc: { ru: 'Анализатор Java библиотек', en: 'Java library analyzer' }, category: 'others', links: ['https://github.com/Lafferrr/SSTools/raw/refs/heads/main/SSTools/JavaLibraryAnalyzer/JavaLibraryAnalyzer.exe'], fileName: 'JavaLibraryAnalyzer.exe' },
        { name: 'PJ Cheat Scanner Lite', desc: { ru: 'Строковый чекер', en: 'String checker' }, category: 'others', links: ['https://github.com/gorbgallin/Pj-sCheatScannerLite/releases/download/1.1/PjCheatScannerLite.exe'], fileName: 'PjCheatScannerLite.exe' },
        { name: 'WinLiveInfo', desc: { ru: 'Анализ системы и просмотр логов загрузки', en: 'System analyze and boot log viewer' }, category: 'others', links: ['https://github.com/kacos2000/Win10LiveInfo/releases/download/v.1.0.23.0/WinLiveInfo.exe'], fileName: 'WinLiveInfo.exe' },
        { name: 'DiskDrill', desc: { ru: 'Мощный инструмент для восстановления данных', en: 'Powerful data recovery tool' }, category: 'others', links: ['https://www.cleverfiles.com/disk-drill-windows.html'], fileName: 'DiskDrillSetup.exe' },
        { name: 'FTK Imager', desc: { ru: 'Создание дампов памяти и просмотр образов дисков', en: 'Memory dumping and disk image viewer' }, category: 'others', links: ['https://www.exterro.com/ftk-imager'], fileName: 'FTKImager.exe' },
        { name: 'Bytecode Viewer', desc: { ru: 'Просмотр байт кода Java', en: 'Java bytecode viewer' }, category: 'decompilers', links: ['https://github.com/Konloch/bytecode-viewer/releases'], fileName: 'Bytecode-Viewer-2.13.1.jar' },
        { name: 'JBytedit', desc: { ru: 'Редактор байт кода Java', en: 'Java bytecode editor' }, category: 'decompilers', links: ['https://github.com/BytecodeDL/JBytedit/releases'], fileName: 'JBytedit-v0.3.1.jar' },
        { name: 'JD-GUI', desc: { ru: 'Классический декомпилятор Java', en: 'Classic Java decompiler with GUI' }, category: 'decompilers', links: ['https://github.com/java-decompiler/jd-gui/releases'], fileName: 'jd-gui-1.6.6.jar' },
        { name: 'Luyten', desc: { ru: 'Декомпилятор Java на основе Procyon', en: 'Java GUI decompiler based on Procyon' }, category: 'decompilers', links: ['https://github.com/deathmarine/Luyten/releases/download/v0.5.4_Rebuilt_with_Latest_depenencies/luyten-0.5.4.exe'], fileName: 'luyten-0.5.4.exe' },
        { name: 'Recaf', desc: { ru: 'Редактор байт кода и декомпилятор Java', en: 'Powerful Java bytecode editor and decompiler' }, category: 'decompilers', links: ['https://github.com/Col-E/Recaf/releases'], fileName: 'recaf-4x-alpha-win-86x64.jar' }
    ];

    const scriptActions = [
        { name: 'Running Processes', desc: { ru: 'Список всех запущенных процессов', en: 'List of all running processes' }, category: 'scripts', command: 'Get-Process | Sort-Object CPU -Descending | Format-Table Name,ID,CPU,WorkingSet -AutoSize' },
        { name: 'Zeezy Services', desc: { ru: 'Запускает чекинг служб от zeezyexe', en: 'Runs zeezyexe services checker' }, category: 'scripts', command: 'Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass; Invoke-Expression (Invoke-RestMethod \'https://raw.githubusercontent.com/zeezyexe/services-checker/refs/heads/main/zeezyservices.psl\')' },
        { name: 'Doomsday Finder', desc: { ru: 'Запускает DoomsDayDetector от zedoonvm1', en: 'Runs zedoonvm1 DoomsDayDetector' }, category: 'scripts', command: 'Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass; Invoke-Expression (Invoke-RestMethod \'https://raw.githubusercontent.com/zedoonvm1/powershell-scripts/refs/heads/main/DoomsDayDetector.ps1\')' },
        { name: 'P1ae\'s Mod Analyzer', desc: { ru: 'Запускает мод анализатор от p1aegg', en: 'Runs p1aegg mod analyzer' }, category: 'scripts', command: 'Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass; Invoke-Expression (Invoke-RestMethod \'https://raw.githubusercontent.com/p1aegg/powershell/refs/heads/main/modanalyzer.ps1\')' },
        { name: 'Macro Scanner', desc: { ru: 'Сканирование макросов мыши от zeezy', en: 'Mouse macro scanning (zeezy)' }, category: 'scripts', command: 'Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass; Invoke-Expression (Invoke-RestMethod \'https://raw.githubusercontent.com/zeezyexe/macro-scanner/refs/heads/main/catchmacro.ps1\')' },
        { name: 'ClassLoader Dump', desc: { ru: 'Дамп ClassLoader', en: 'ClassLoader data dump' }, category: 'scripts', command: 'Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass; Invoke-Expression (Invoke-RestMethod \'https://raw.githubusercontent.com/p1aegg/powershell/refs/heads/main/ClassLoaderDump.ps1\')' },
        { name: 'Meow Mod Analyzer', desc: { ru: 'Запускает мод анализатор от MeowTonynoh', en: 'Runs MeowTonynoh mod analyzer' }, category: 'scripts', command: 'Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass; Invoke-Expression (Invoke-RestMethod \'https://raw.githubusercontent.com/MeowTonynoh/MeowModAnalyzer/main/MeowModAnalyzer.ps1\')' },
        { name: 'Prefetch Integrity Analyzer', desc: { ru: 'Анализ целостности Prefetch от RedLotus', en: 'Prefetch integrity analysis (RedLotus)' }, category: 'scripts', command: 'Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass; Invoke-Expression (Invoke-RestMethod \'https://raw.githubusercontent.com/bacanoicua/Screenshare/main/RedLotusPrefetchIntegrityAnalyzer.ps1\')' },
        { name: 'Lily Services', desc: { ru: 'Запускает чекинг служб от PraiseLily', en: 'Runs PraiseLily services checker' }, category: 'scripts', command: 'Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass; Invoke-Expression (Invoke-RestMethod \'https://raw.githubusercontent.com/Lafferrr/SSTools/refs/heads/main/LilysServices\')' },
        { name: 'DQRKIS Fucker', desc: { ru: 'Запускает чекер артефактов от DQRKIS', en: 'Runs DQRKIS artifact checker' }, category: 'scripts', command: 'Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass; Invoke-Expression (Invoke-RestMethod \'https://raw.githubusercontent.com/cheesecatlol/DQRKIS-FUCKER/refs/heads/main/DqrkisFucker.ps1\')' },
        { name: 'MacroDetector', desc: { ru: 'Обнаружение макросов и кликеров', en: 'Macro and clicker detection' }, category: 'scripts', command: 'Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass; Invoke-Expression (Invoke-RestMethod \'https://raw.githubusercontent.com/NiccBlahh/MacroDetector/refs/heads/main/MacroDetector.ps1\')' }
    ];

    const credits = [
        { name: 'Montegs', role: { ru: 'Инструменты Montegs для анализа артефактов.', en: 'Montegs tools for artifact analysis.' }, source: 'github.com/softmethod' },
        { name: 'OrbDiff', role: { ru: 'Инструменты OrbDiff.', en: 'OrbDiff forensic tools.' }, source: 'github.com/Orbdiff' },
        { name: 'Spokwn', role: { ru: 'Инструменты Spokwn.', en: 'Spokwn forensic tools.' }, source: 'github.com/spokwn' },
        { name: 'DetectAC', role: { ru: 'Набор бесплатных инструментов DetectAC.', en: 'Free DetectAC tools suite.' }, source: 'detect.ac, github.com/detect-ac' },
        { name: 'NirSoft', role: { ru: 'Утилиты NirSoft.', en: 'NirSoft utilities.' }, source: 'nirsoft.net' },
        { name: 'Eric Zimmerman', role: { ru: 'Инструменты Eric Zimmerman.', en: 'Eric Zimmerman forensic tools.' }, source: 'ericzimmerman.github.io' }
    ];

    let currentCategory = 'montegs';
    let searchQuery = '';
    let currentLang = 'ru';
    let currentScriptCommand = '';

    const categoryList = document.getElementById('categoryList');
    const toolsGrid = document.getElementById('toolsGrid');
    const categoryTitle = document.getElementById('categoryTitle');
    const categoryDesc = document.getElementById('categoryDesc');
    const categoryHeader = document.getElementById('categoryHeader');
    const searchInput = document.getElementById('searchInput');
    const searchLabel = document.getElementById('searchLabel');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const searchHint = document.getElementById('searchHint');
    const itemCount = document.getElementById('itemCount');
    const langSlider = document.getElementById('langSlider');
    const langRu = document.getElementById('langRu');
    const langEn = document.getElementById('langEn');
    const headerSubtitle = document.getElementById('headerSubtitle');
    const categoriesTitle = document.getElementById('categoriesTitle');
    const categoriesHint = document.getElementById('categoriesHint');
    const scriptModal = document.getElementById('scriptModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalSub = document.getElementById('modalSub');
    const modalCommand = document.getElementById('modalCommand');
    const copySuccess = document.getElementById('copySuccess');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalCopyBtn = document.getElementById('modalCopyBtn');

    const translations = {
        ru: {
            title: 'Montegs Downloader', subtitle: 'Загрузчик инструментов', categories: 'Категории', categoriesHint: 'Выберите категорию',
            searchPlaceholder: 'Ввод...', searchLabel: 'ПОИСК',
            emptySearch: 'По запросу "{query}" ничего не найдено.', emptyCategory: 'В этой категории нет инструментов.',
            searchResults: 'Результаты поиска', searchDesc: 'Найдено совпадений по запросу "{query}": {count}',
            searchHeader: 'Поиск сканирует названия, описания, категории и источники.',
            credits: 'Авторы и источники', items: 'инструментов',
            scriptCopied: 'Скопируйте скрипт и вставьте его в PowerShell', scriptTitle: 'Скрипт',
            copy: 'Копировать', close: 'Закрыть', copied: '✓ Скопировано!'
        },
        en: {
            title: 'Montegs Downloader', subtitle: 'Tool Downloader', categories: 'Categories', categoriesHint: 'Select a category',
            searchPlaceholder: 'Input...', searchLabel: 'FIND',
            emptySearch: 'No tools matched "{query}".', emptyCategory: 'No items in this category.',
            searchResults: 'Search Results', searchDesc: 'Live matches for "{query}": {count}',
            searchHeader: 'Search scans tool names, descriptions, categories, and sources.',
            credits: 'Credits & Sources', items: 'items',
            scriptCopied: 'Script copied. Paste it into PowerShell', scriptTitle: 'Script',
            copy: 'Copy', close: 'Close', copied: '✓ Copied!'
        }
    };

    function getLang() { return translations[currentLang] || translations.ru; }

    function toggleLang() {
        currentLang = currentLang === 'ru' ? 'en' : 'ru';
        langSlider.className = 'lang-slider ' + (currentLang === 'en' ? 'en' : 'ru');
        langRu.classList.toggle('active', currentLang === 'ru');
        langEn.classList.toggle('active', currentLang === 'en');
        headerSubtitle.textContent = getLang().subtitle;
        categoriesTitle.textContent = getLang().categories;
        categoriesHint.textContent = getLang().categoriesHint;
        searchInput.placeholder = getLang().searchPlaceholder;
        searchLabel.textContent = getLang().searchLabel;
        renderAll(); updateModalLang();
    }

    function updateModalLang() {
        const lang = getLang();
        modalCloseBtn.textContent = lang.close;
        modalCopyBtn.textContent = lang.copy;
    }

    function getCategoryItems(key) {
        if (key === 'scripts') return scriptActions;
        if (key === 'credits') return credits;
        return allTools.filter(t => t.category === key);
    }

    function getSearchItems(query) {
        const q = query.toLowerCase().trim();
        if (!q) return [];
        const all = [...allTools, ...scriptActions];
        return all.filter(item => {
            const name = (item.name || '').toLowerCase();
            const desc = (typeof item.desc === 'object') ? (item.desc[currentLang] || item.desc.ru || '').toLowerCase() : (item.desc || '').toLowerCase();
            const cat = (item.category || '').toLowerCase();
            const catLabel = categories.find(c => c.key === cat)?.label?.[currentLang]?.toLowerCase() || '';
            const combined = name + ' ' + desc + ' ' + cat + ' ' + catLabel;
            const terms = q.split(/\s+/);
            return terms.every(term => combined.includes(term));
        });
    }

    function getDisplayItems() {
        if (searchQuery.trim()) return getSearchItems(searchQuery);
        if (currentCategory === 'scripts') return scriptActions;
        if (currentCategory === 'credits') return credits;
        return allTools.filter(t => t.category === currentCategory);
    }

    function getCategoryCount(key) {
        if (key === 'scripts') return scriptActions.length;
        if (key === 'credits') return credits.length;
        return allTools.filter(t => t.category === key).length;
    }

    function updateCategoryButtons() {
        document.querySelectorAll('.category-btn').forEach(btn => {
            const key = btn.dataset.key;
            const count = getCategoryCount(key);
            const cat = categories.find(c => c.key === key);
            const label = cat ? cat.label[currentLang] : key;
            btn.innerHTML = `${label} <span class="badge">${count}</span>`;
            btn.classList.toggle('active', key === currentCategory);
        });
    }

    function updateItemCount() {
        const items = getDisplayItems();
        const lang = getLang();
        itemCount.textContent = `${items.length} ${lang.items}`;
    }

    function getLocalizedText(obj) {
        if (typeof obj === 'string') return obj;
        if (obj && typeof obj === 'object') return obj[currentLang] || obj.ru || 'No description';
        return 'No description';
    }

    function openModal(name, command) {
        const lang = getLang();
        modalTitle.textContent = lang.scriptTitle + ': ' + name;
        modalSub.textContent = lang.scriptCopied;
        modalCommand.textContent = command;
        currentScriptCommand = command;
        copySuccess.classList.remove('show');
        updateModalLang();
        scriptModal.classList.add('active');
    }

    function closeModal() { scriptModal.classList.remove('active'); }

    function copyCommand() {
        const lang = getLang();
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(currentScriptCommand).then(() => {
                copySuccess.classList.add('show'); copySuccess.textContent = lang.copied;
                setTimeout(() => copySuccess.classList.remove('show'), 3000);
            }).catch(() => fallbackCopy(currentScriptCommand));
        } else fallbackCopy(currentScriptCommand);
    }

    function fallbackCopy(text) {
        const lang = getLang();
        const textarea = document.createElement('textarea');
        textarea.value = text; textarea.style.position = 'fixed'; textarea.style.opacity = '0';
        document.body.appendChild(textarea); textarea.select();
        try {
            document.execCommand('copy');
            copySuccess.classList.add('show'); copySuccess.textContent = lang.copied;
            setTimeout(() => copySuccess.classList.remove('show'), 3000);
        } catch (e) { alert('Не удалось скопировать.'); }
        document.body.removeChild(textarea);
    }

    scriptModal.addEventListener('click', (e) => { if (e.target === scriptModal) closeModal(); });
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && scriptModal.classList.contains('active')) closeModal(); });

    function renderCategories() {
        categoryList.innerHTML = '';
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'category-btn';
            btn.dataset.key = cat.key;
            const count = getCategoryCount(cat.key);
            const label = cat.label[currentLang] || cat.label.ru;
            btn.innerHTML = `${label} <span class="badge">${count}</span>`;
            if (cat.key === currentCategory) btn.classList.add('active');
            btn.addEventListener('click', () => {
                currentCategory = cat.key; searchQuery = ''; searchInput.value = ''; 
                clearSearchBtn.classList.remove('visible'); renderAll();
            });
            categoryList.appendChild(btn);
        });
    }

    function renderTools() {
        toolsGrid.innerHTML = '';
        const items = getDisplayItems();
        const lang = getLang();

        if (items.length === 0) {
            const empty = document.createElement('div'); empty.className = 'empty-state';
            empty.textContent = searchQuery.trim() ? lang.emptySearch.replace('{query}', searchQuery) : lang.emptyCategory;
            toolsGrid.appendChild(empty); return;
        }

        if (!searchQuery.trim() && currentCategory === 'credits') {
            items.forEach(credit => {
                const card = document.createElement('div'); card.className = 'credit-card';
                card.innerHTML = `<div class="name">${credit.name}</div><div class="role">${getLocalizedText(credit.role)}</div><div class="source">${credit.source}</div>`;
                toolsGrid.appendChild(card);
            }); return;
        }

        items.forEach(item => {
            const card = document.createElement('div');
            card.className = 'tool-card';
            card.innerHTML = `
                <div class="name">${item.name}</div>
                <div class="desc">${getLocalizedText(item.desc)}</div>
                ${item.fileName ? `<div class="file-name">${item.fileName}</div>` : ''}
            `;

            card.addEventListener('click', () => {
                const isScript = scriptActions.includes(item);
                if (isScript) {
                    if (item.command) openModal(item.name, item.command);
                } else if (item.links && item.links.length > 0) {
                    window.open(item.links[0], '_blank');
                }
            });

            toolsGrid.appendChild(card);
        });
    }

    function renderAll() {
        const lang = getLang();
        const cat = categories.find(c => c.key === currentCategory);

        if (searchQuery.trim()) {
            const count = getDisplayItems().length;
            categoryTitle.textContent = lang.searchResults;
            categoryDesc.textContent = lang.searchDesc.replace('{query}', searchQuery).replace('{count}', count);
            categoryHeader.textContent = lang.searchHeader;
        } else if (cat) {
            categoryTitle.textContent = cat.label[currentLang] || cat.label.ru;
            categoryDesc.textContent = getLocalizedText(cat.desc);
            categoryHeader.textContent = cat.header[currentLang] || cat.header.ru;
        }

        updateItemCount(); renderTools(); updateCategoryButtons(); updateModalLang();
    }

    function onSearch() {
        searchQuery = searchInput.value;
        clearSearchBtn.classList.toggle('visible', !!searchQuery);
        renderAll();
    }

    function clearSearch() {
        searchInput.value = ''; searchQuery = '';
        clearSearchBtn.classList.remove('visible');
        renderAll(); searchInput.focus();
    }

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && searchInput.value) { clearSearch(); e.preventDefault(); }
    });

    document.querySelector('.status-bar')?.addEventListener('dblclick', () => {
        currentCategory = 'credits'; searchQuery = ''; searchInput.value = '';
        clearSearchBtn.classList.remove('visible'); renderAll();
    });

    renderCategories(); renderAll();
</script>
</body>
</html>
